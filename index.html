<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaaS Operations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0f;--s1:#161618;--s2:#1e1e21;--s3:#252528;
  --b1:#2a2a2f;--b2:#383840;--b3:#48484f;
  --acc:#c8f060;--pur:#7c6af7;--yel:#f0c83c;--red:#f06060;--amb:#f0a060;
  --tx:#e8e6e1;--mu:#7a7880;--mu2:#4a4950;
  --r:8px;
}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;min-height:100vh;padding:22px 26px 40px;}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pu 1s ease-in-out infinite;}
.ltxt{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.55)}}

/* HEADER */
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.3px;}
.hdr h1 em{color:var(--acc);font-style:normal;}
.sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu2);margin-bottom:16px;}
.wbadge{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);background:var(--s1);border:1px solid var(--b1);padding:3px 11px;border-radius:20px;}

/* STATUS BAR */
.sbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid;}
.pill.ok{color:var(--acc);border-color:rgba(200,240,96,.2);background:rgba(200,240,96,.05);}
.pill.warn{color:var(--amb);border-color:rgba(240,160,96,.2);background:rgba(240,160,96,.05);}
.pill.flag{color:var(--red);border-color:rgba(240,96,96,.2);background:rgba(240,96,96,.05);}

/* CoS */
.cos{background:var(--s1);border:1px solid rgba(124,106,247,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;}
.cos-hd{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.cos-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--pur);}
.cos-txt{font-size:12px;color:var(--mu);line-height:1.6;}
.cos-btn{margin-top:8px;background:none;border:1px solid rgba(124,106,247,.25);color:var(--pur);font-family:'Syne',sans-serif;font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;transition:background .15s;}
.cos-btn:hover{background:rgba(124,106,247,.1);}

/* SECTION LABEL */
.slbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu2);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.slbl small{font-size:9px;color:var(--mu2);opacity:.7;letter-spacing:.3px;}

/* TOP COLS — backlog + actions */
.top-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.pool{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:12px;}
.pool-cards{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;}
.card{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:6px 10px;cursor:grab;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;user-select:none;transition:border-color .15s,transform .1s;}
.card:hover{border-color:var(--b2);transform:translateY(-1px);}
.card.dragging{opacity:.25;}
.card .rm{background:none;border:none;color:var(--mu2);font-size:13px;cursor:pointer;padding:0 1px;opacity:0;transition:opacity .15s;line-height:1;margin-left:3px;}
.card:hover .rm{opacity:1;}
.adot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.a0{background:var(--b2);}.a1{background:var(--amb);opacity:.6;}.a2{background:var(--amb);}.a3{background:var(--red);}
.ydot{width:6px;height:6px;border-radius:50%;background:var(--yel);flex-shrink:0;}
.add-row{display:flex;gap:6px;margin-top:9px;}
.add-row input{background:var(--s2);border:1px solid var(--b1);color:var(--tx);font-family:'Syne',sans-serif;font-size:12px;padding:6px 10px;border-radius:6px;flex:1;outline:none;transition:border-color .15s;}
.add-row input:focus{border-color:var(--acc);}
.add-row input::placeholder{color:var(--mu2);}
.add-row button{background:var(--s3);border:1px solid var(--b2);color:var(--tx);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .15s;}
.add-row button:hover{background:var(--b1);}

/* MONTHLY RHYTHM SUMMARY */
.monthly-strip{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;}
.monthly-items{display:flex;gap:16px;flex-wrap:wrap;}
.m-item{display:flex;align-items:center;gap:6px;cursor:default;position:relative;}
.m-icon{font-size:14px;}
.m-nums{font-family:'DM Mono',monospace;font-size:11px;}
.m-nums .mv{color:var(--tx);font-weight:500;}
.m-nums .mt{color:var(--mu2);}
.m-bar{width:40px;height:3px;background:var(--s2);border-radius:2px;overflow:hidden;}
.m-fill{height:100%;border-radius:2px;background:var(--pur);transition:width .4s;}
.m-fill.hit{background:var(--acc);}
.m-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--b2);border-radius:6px;padding:5px 9px;font-size:11px;white-space:nowrap;z-index:10;pointer-events:none;color:var(--tx);}
.m-item:hover .m-tooltip{display:block;}

/* CALENDAR NAV */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cal-nav .slbl{margin:0;flex:1;}
.nbtn{background:var(--s1);border:1px solid var(--b1);color:var(--mu);font-family:'DM Mono',monospace;font-size:12px;width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
.nbtn:hover{border-color:var(--b2);color:var(--tx);}
.tbtn{background:var(--s1);border:1px solid var(--b1);color:var(--mu);font-family:'DM Mono',monospace;font-size:10px;padding:3px 11px;border-radius:20px;cursor:pointer;transition:border-color .15s,color .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);}

/* CALENDAR STRIP */
.cal-wrap{overflow:hidden;width:100%;}
.cal-strip{display:flex;gap:8px;transition:transform .32s cubic-bezier(.4,0,.2,1);align-items:flex-start;}

/* WEEK COLUMN — COLLAPSED */
.wk{flex:0 0 0;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;transition:flex-basis .32s cubic-bezier(.4,0,.2,1),border-color .2s,opacity .2s;cursor:pointer;min-height:80px;}
.wk.past{opacity:.55;}
.wk.current{border-color:rgba(200,240,96,.28);background:#0f1210;}
.wk.expanded{cursor:default;border-color:rgba(200,240,96,.35);}

/* collapsed inner */
.wk-inner{padding:8px 7px;display:flex;flex-direction:column;gap:5px;height:100%;}
.wk-top{display:flex;align-items:baseline;justify-content:space-between;gap:4px;}
.wk-num{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;white-space:nowrap;}
.wk.current .wk-num{color:var(--acc);}
.wk.past .wk-num{color:var(--mu2);}
.wk-tag{font-family:'DM Mono',monospace;font-size:8px;color:var(--mu2);white-space:nowrap;}
.wk.current .wk-tag{color:rgba(200,240,96,.5);}
.wk-dates{font-family:'DM Mono',monospace;font-size:8px;color:var(--mu2);white-space:nowrap;}
.wk-count{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu2);}
/* rhythm mini icons in collapsed */
.rh-mini{display:flex;flex-direction:column;gap:2px;margin-top:3px;}
.rh-mini-row{display:flex;align-items:center;gap:4px;position:relative;}
.rh-mini-icon{font-size:10px;line-height:1;}
.rh-mini-val{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);}
.rh-mini-val.hit{color:var(--acc);}
.rh-mini-tip{display:none;position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--s3);border:1px solid var(--b2);border-radius:5px;padding:4px 8px;font-size:10px;white-space:nowrap;z-index:20;pointer-events:none;color:var(--tx);}
.rh-mini-row:hover .rh-mini-tip{display:block;}

/* EXPANDED WEEK */
.wk-exp{padding:14px;display:none;}
.wk.expanded .wk-exp{display:block;}
.wk.expanded .wk-inner{display:none;}
.exp-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.exp-title{font-size:14px;font-weight:700;}
.wk.current .exp-title em{color:var(--acc);font-style:normal;}
.exp-dates{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);}
.exp-close{background:none;border:1px solid var(--b1);color:var(--mu);font-family:'DM Mono',monospace;font-size:10px;padding:3px 10px;border-radius:20px;cursor:pointer;transition:border-color .15s;}
.exp-close:hover{border-color:var(--b2);color:var(--tx);}

/* kanban in expanded */
.k-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.k-col{border-radius:6px;padding:9px;min-height:80px;}
.k-col.ct{background:rgba(240,200,60,.05);border:1px solid rgba(240,200,60,.15);}
.k-col.cd{background:rgba(124,106,247,.05);border:1px solid rgba(124,106,247,.15);}
.k-col.cn{background:rgba(200,240,96,.04);border:1px solid rgba(200,240,96,.1);}
.k-hd{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--b1);}
.ct .k-hd{color:rgba(240,200,60,.7);}.cd .k-hd{color:rgba(124,106,247,.8);}.cn .k-hd{color:rgba(200,240,96,.7);}
.kcard{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:5px 8px;font-size:11px;font-weight:500;cursor:grab;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:4px;transition:border-color .15s;}
.kcard:hover{border-color:var(--b2);}
.kcard .rm{background:none;border:none;color:var(--mu2);font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s;line-height:1;}
.kcard:hover .rm{opacity:1;}
.dtgt{min-height:28px;border-radius:4px;border:1px dashed transparent;transition:border-color .15s,background .15s;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;color:transparent;}
.dtgt.over{border-color:var(--b2);background:rgba(255,255,255,.03);color:var(--mu2);}

/* rhythm in expanded */
.exp-rh{border-top:1px solid var(--b1);padding-top:12px;}
.rh-title-row{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mu2);margin-bottom:8px;}
.rh-rows{display:flex;flex-direction:column;gap:6px;}
.rh-row{display:flex;align-items:center;gap:8px;}
.rh-icon{font-size:13px;width:18px;text-align:center;}
.rh-lbl{font-size:12px;font-weight:500;flex:1;}
.rh-tgt{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu2);}
.rh-ctr{display:flex;align-items:center;gap:4px;}
.cb{background:var(--s2);border:1px solid var(--b1);color:var(--tx);width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .1s;font-family:'Syne',sans-serif;}
.cb:hover{background:var(--b1);}
.cv{font-family:'DM Mono',monospace;font-size:11px;min-width:18px;text-align:center;}
.rh-bar{height:3px;background:var(--s2);border-radius:2px;width:60px;overflow:hidden;}
.rh-fill{height:100%;border-radius:2px;background:var(--pur);transition:width .35s;}
.rh-fill.hit{background:var(--acc);}

/* FOOTER */
.footer{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--b1);margin-top:20px;}
.savebtn{background:var(--acc);color:#0e0e0f;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;border:none;padding:8px 20px;border-radius:var(--r);cursor:pointer;transition:opacity .15s;}
.savebtn:hover{opacity:.85;}
.savebtn:disabled{opacity:.35;cursor:not-allowed;}
.savest{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);}
.savest.saving{color:var(--amb);}.savest.saved{color:var(--acc);}.savest.err{color:var(--red);}
</style>
</head>
<body>

<div id="loader"><div class="ldot"></div><div class="ltxt" id="ltxt">Connecting to Brain...</div></div>

<div id="app" style="display:none">
  <div class="hdr">
    <h1>BaaS <em>Operations</em></h1>
    <span class="wbadge" id="wbadge">—</span>
  </div>
  <div class="sub">The BaaS Company · Leoni Janssen</div>
  <div class="sbar" id="sbar"></div>

  <div class="cos">
    <div class="cos-hd">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><polygon points="7,1 13,4.5 13,9.5 7,13 1,9.5 1,4.5" stroke="#7c6af7" stroke-width="1.2" fill="none"/><circle cx="7" cy="7" r="1.8" fill="#7c6af7"/></svg>
      <span class="cos-lbl">Chief of Staff</span>
    </div>
    <div class="cos-txt" id="cosmsg">Analysing board...</div>
    <button class="cos-btn" onclick="askCoS()">Full briefing ↗</button>
  </div>

  <div class="top-cols">
    <div class="pool">
      <div class="slbl">Backlog <small>fuzzy · no plan yet</small></div>
      <div class="pool-cards" id="blCards"
        ondragover="poolOver(event)" ondragleave="poolLeave(event)" ondrop="poolDrop(event,'backlog')"></div>
      <div class="add-row">
        <input id="blIn" placeholder="Add idea..." onkeydown="if(event.key==='Enter')addCard('backlog')">
        <button onclick="addCard('backlog')">+ Add</button>
      </div>
    </div>
    <div class="pool">
      <div class="slbl">Actions <small>clear tasks · ready to plan</small></div>
      <div class="pool-cards" id="actCards"
        ondragover="poolOver(event)" ondragleave="poolLeave(event)" ondrop="poolDrop(event,'actions')"></div>
      <div class="add-row">
        <input id="actIn" placeholder="Add action..." onkeydown="if(event.key==='Enter')addCard('actions')">
        <button onclick="addCard('actions')">+ Add</button>
      </div>
    </div>
  </div>

  <!-- MONTHLY RHYTHM SUMMARY -->
  <div class="monthly-strip">
    <div class="slbl" style="margin-bottom:9px">Rolling 4-week rhythm <small>hover for detail</small></div>
    <div class="monthly-items" id="monthlyItems"></div>
  </div>

  <!-- CALENDAR -->
  <div>
    <div class="cal-nav">
      <div class="slbl" style="margin:0;flex:1">Weekly calendar</div>
      <button class="nbtn" onclick="nav(-4)" title="−4 weeks">«</button>
      <button class="nbtn" onclick="nav(-1)" title="−1 week">‹</button>
      <button class="tbtn" onclick="goNow()">now</button>
      <button class="nbtn" onclick="nav(1)" title="+1 week">›</button>
      <button class="nbtn" onclick="nav(4)" title="+4 weeks">»</button>
    </div>
    <div class="cal-wrap" id="calWrap">
      <div class="cal-strip" id="calStrip"></div>
    </div>
  </div>

  <div class="footer">
    <div class="savest" id="saveSt">Connected to Brain</div>
    <button class="savebtn" id="saveBtn" onclick="save()">Save to Brain</button>
  </div>
</div>

<script>
const PROJECT_ID = 'proj_Rv3aAAu49zkuEmkOhAlhLQ';
const DOC_ID     = 'doc_wHbr7d396DWCz-pECowXWQ';
const SESSION_ID = 'sess_NAf-lRrr-TFGowKGN01dKg';
const API        = 'https://api.anthropic.com/v1/messages';
const MODEL      = 'claude-sonnet-4-20250514';
const MCP        = [{type:'url',url:'https://brain.thebaascompany.com/ai/mcp',name:'the-brain'}];

let S = null;
let dragItem = null, dragSrc = null;
let calOffset = 0;       // centre = currentWeek + calOffset
let expandedWk = null;   // which week is expanded

// ── WEEK UTILS ──────────────────────────────────────────────
const NOW = new Date();

function wkNum(d){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));
  const y=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  return Math.ceil((((u-y)/86400000)+1)/7);
}
function wkKey(d){ return `${d.getFullYear()}-W${String(wkNum(d)).padStart(2,'0')}`; }
function addWeeks(base,n){ const d=new Date(base); d.setDate(d.getDate()+n*7); return d; }
function mondayOf(d){ const r=new Date(d); const day=r.getDay()||7; r.setDate(r.getDate()-day+1); r.setHours(0,0,0,0); return r; }
function wkRange(wkStr){
  const [yr,w]=wkStr.split('-W').map(Number);
  const jan4=new Date(yr,0,4);
  const mon=mondayOf(jan4);
  mon.setDate(mon.getDate()+(w-1)*7);
  const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return [mon,sun];
}
function fmt(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
const CURRENT_WK = wkKey(NOW);

function wkLabel(k){
  const prev=wkKey(addWeeks(NOW,-7));
  const next=wkKey(addWeeks(NOW,7));
  if(k===prev) return 'last week';
  if(k===CURRENT_WK) return 'this week';
  if(k===next) return 'next week';
  return '';
}

// ── LOAD ────────────────────────────────────────────────────
async function load(){
  setLT('Reading Brain...');
  try {
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:2000,
        system:'Return ONLY the raw JSON object from inside the ```json...``` block. No explanation, no fences.',
        messages:[{role:'user',content:`Fetch document ${DOC_ID} from Brain Area ${PROJECT_ID} and return only the JSON block.`}],
        mcp_servers:MCP})});
    const d=await r.json();
    const tb=d.content?.find(b=>b.type==='text');
    if(tb?.text){
      try{
        let raw=tb.text.trim().replace(/^```json\s*/,'').replace(/\s*```$/,'').trim();
        const si=raw.indexOf('{'); if(si>0) raw=raw.slice(si);
        S=JSON.parse(raw);
      }catch(e){S=dflt();}
    }else{S=dflt();}
  }catch(e){S=dflt();}
  ensureWeeks();
  render();
}
function setLT(t){document.getElementById('ltxt').textContent=t;}

function dflt(){
  return {
    schema_version:'3.0',last_updated:NOW.toISOString().split('T')[0],
    backlog:[
      {id:'bl-001',title:'Brain onboarding email flow',added:'2026-04-09',age_weeks:0},
      {id:'bl-002',title:'Brain onboarding program',added:'2026-04-09',age_weeks:0},
      {id:'bl-003',title:'Skeleton book and book plan',added:'2026-04-09',age_weeks:0},
      {id:'bl-004',title:'Lead magnet ICP1',added:'2026-04-09',age_weeks:0},
      {id:'bl-005',title:'Lead magnet ICP2',added:'2026-04-09',age_weeks:0},
      {id:'bl-006',title:'Create account management agents',added:'2026-04-09',age_weeks:0}
    ],
    actions:[],
    rhythm_config:[
      {id:'rh-001',title:'LinkedIn posts',icon:'💼',target_weekly:3,unit:'posts'},
      {id:'rh-002',title:'Blog post',icon:'✍️',target_weekly:1,unit:'posts'},
      {id:'rh-003',title:'Conversations beyond clients',icon:'💬',target_weekly:3,unit:'convos'},
      {id:'rh-004',title:'Outreaches',icon:'📤',target_weekly:5,unit:'per day'},
      {id:'rh-005',title:'Brain user emails',icon:'📧',target_weekly:0,target_monthly:2,unit:'emails'}
    ],
    weeks:{},cos_flags:[]
  };
}

function emptyRhythm(){
  const r={};
  (S.rhythm_config||[]).forEach(rc=>r[rc.id]=0);
  return r;
}

function ensureWeeks(){
  if(!S.weeks) S.weeks={};
  for(let i=-8;i<=16;i++){
    const k=wkKey(addWeeks(NOW,i*7));
    if(!S.weeks[k]) S.weeks[k]={kanban:{today:[],doing:[],done:[]},rhythm:emptyRhythm()};
    if(!S.weeks[k].rhythm) S.weeks[k].rhythm=emptyRhythm();
  }
}

// ── RENDER ALL ───────────────────────────────────────────────
function render(){
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('wbadge').textContent=`W${wkNum(NOW)} · ${fmt(NOW)}`;
  renderStatus(); renderCoS(); renderBacklog(); renderActions();
  renderMonthly(); renderCal();
}

function renderStatus(){
  const f=[];
  if(S.backlog.length>7) f.push({t:'warn',s:`Backlog: ${S.backlog.length}`});
  const stale=S.backlog.filter(i=>i.age_weeks>=3);
  if(stale.length) f.push({t:'flag',s:`${stale.length} stale 3w+`});
  if(S.actions.length) f.push({t:'ok',s:`${S.actions.length} action${S.actions.length>1?'s':''} ready`});
  const wk=S.weeks[CURRENT_WK];
  const zeros=(S.rhythm_config||[]).filter(rc=>{
    if(rc.target_weekly===0) return false;
    return (wk?.rhythm?.[rc.id]||0)===0;
  });
  if(zeros.length) f.push({t:'warn',s:`${zeros.length} rhythm at 0`});
  const hits=(S.rhythm_config||[]).filter(rc=>rc.target_weekly>0&&(wk?.rhythm?.[rc.id]||0)>=rc.target_weekly);
  if(hits.length) f.push({t:'ok',s:`${hits.length} rhythm on target`});
  if(!f.length) f.push({t:'ok',s:'All clear'});
  document.getElementById('sbar').innerHTML=f.map(x=>`<span class="pill ${x.t}">${x.s}</span>`).join('');
}

function renderCoS(){
  const msgs=[];
  if(S.backlog.length>=8) msgs.push(`Backlog at ${S.backlog.length} items — time to prioritise. Pull the top 2-3 into Actions.`);
  const stale=S.backlog.filter(i=>i.age_weeks>=3);
  if(stale.length) msgs.push(`${stale.length} backlog item${stale.length>1?'s':''} sitting 3+ weeks without moving.`);
  const wk=S.weeks[CURRENT_WK];
  const active=(wk?.kanban?.today?.length||0)+(wk?.kanban?.doing?.length||0);
  if(active===0&&S.actions.length>0) msgs.push(`Nothing in this week yet — ${S.actions.length} action${S.actions.length>1?'s':''} ready to pull in.`);
  const zeroCfg=(S.rhythm_config||[]).filter(rc=>rc.target_weekly>0&&(wk?.rhythm?.[rc.id]||0)===0);
  if(zeroCfg.length>=3) msgs.push(`${zeroCfg.length} rhythm items untouched this week.`);
  const hit=(S.rhythm_config||[]).filter(rc=>rc.target_weekly>0&&(wk?.rhythm?.[rc.id]||0)>=rc.target_weekly);
  document.getElementById('cosmsg').textContent=msgs.length?msgs[0]:
    `${hit.length}/${(S.rhythm_config||[]).filter(r=>r.target_weekly>0).length} rhythm on track. Looking good.`;
}

function renderBacklog(){
  const el=document.getElementById('blCards'); el.innerHTML='';
  (S.backlog||[]).forEach(item=>{
    const ac=item.age_weeks>=3?'a3':item.age_weeks>=2?'a2':item.age_weeks>=1?'a1':'a0';
    const c=mkCard(item,'backlog',`<div class="adot ${ac}" title="${item.age_weeks}w old"></div>${item.title}`);
    el.appendChild(c);
  });
}
function renderActions(){
  const el=document.getElementById('actCards'); el.innerHTML='';
  (S.actions||[]).forEach(item=>{
    const c=mkCard(item,'actions',`<div class="ydot"></div>${item.title}`);
    el.appendChild(c);
  });
}
function mkCard(item,src,inner){
  const c=document.createElement('div');
  c.className='card'; c.draggable=true; c.dataset.id=item.id;
  c.innerHTML=`${inner}<button class="rm" onclick="removeFrom('${src}','${item.id}')">×</button>`;
  c.addEventListener('dragstart',()=>{dragItem=item;dragSrc=src;c.classList.add('dragging');});
  c.addEventListener('dragend',()=>c.classList.remove('dragging'));
  return c;
}

// ── MONTHLY SUMMARY ──────────────────────────────────────────
function renderMonthly(){
  const el=document.getElementById('monthlyItems'); el.innerHTML='';
  const last4=[];
  for(let i=3;i>=0;i--) last4.push(wkKey(addWeeks(NOW,-i*7)));
  (S.rhythm_config||[]).forEach(rc=>{
    const total=last4.reduce((sum,k)=>(S.weeks[k]?.rhythm?.[rc.id]||0)+sum,0);
    const target=rc.target_monthly? rc.target_monthly : rc.target_weekly*4;
    const pct=target>0?Math.min(100,Math.round(total/target*100)):0;
    const hit=total>=target&&target>0;
    const div=document.createElement('div'); div.className='m-item';
    div.innerHTML=`
      <div class="m-tooltip">${rc.title}: ${total}/${target} (4 weeks)</div>
      <div class="m-icon">${rc.icon}</div>
      <div class="m-nums"><span class="mv">${total}</span><span class="mt">/${target}</span></div>
      <div class="m-bar"><div class="m-fill${hit?' hit':''}" style="width:${pct}%"></div></div>`;
    el.appendChild(div);
  });
}

// ── CALENDAR ─────────────────────────────────────────────────
const COLS_VISIBLE = 7; // number of week columns rendered
const BACK_RANGE   = 8; // weeks back from current
const FWD_RANGE    = 16;

function renderCal(){
  const strip=document.getElementById('calStrip');
  strip.innerHTML='';
  for(let i=-BACK_RANGE;i<=FWD_RANGE;i++){
    const d=addWeeks(NOW,i*7);
    const k=wkKey(d);
    ensureWeek(k);
    const wdata=S.weeks[k];
    const isPast=k<CURRENT_WK;
    const isCur=k===CURRENT_WK;
    const isExp=k===expandedWk;
    const [mon,sun]=wkRange(k);
    const lbl=wkLabel(k);
    const totalCards=(wdata.kanban.today?.length||0)+(wdata.kanban.doing?.length||0)+(wdata.kanban.done?.length||0);

    const col=document.createElement('div');
    col.className=`wk${isPast?' past':''}${isCur?' current':''}${isExp?' expanded':''}`;
    col.dataset.wk=k;
    if(!isExp) col.addEventListener('click',()=>expandWeek(k));

    // COLLAPSED VIEW
    const rhMiniRows=(S.rhythm_config||[]).map(rc=>{
      const val=wdata.rhythm?.[rc.id]||0;
      const tw=rc.target_weekly||0;
      const hit=tw>0&&val>=tw;
      return `<div class="rh-mini-row">
        <div class="rh-mini-icon">${rc.icon}</div>
        <div class="rh-mini-val${hit?' hit':''}">${val}${tw>0?'/'+tw:''}</div>
        <div class="rh-mini-tip">${rc.title}: ${val}${tw>0?' / '+tw+' target':''}</div>
      </div>`;
    }).join('');

    col.innerHTML=`
      <div class="wk-inner">
        <div class="wk-top">
          <span class="wk-num">W${wkNum(d)}</span>
          ${lbl?`<span class="wk-tag">${lbl}</span>`:''}
        </div>
        <div class="wk-dates">${fmt(mon)}–${fmt(sun)}</div>
        ${totalCards?`<div class="wk-count">${totalCards} item${totalCards>1?'s':''}</div>`:''}
        <div class="rh-mini">${rhMiniRows}</div>
      </div>

      <div class="wk-exp"
        ondragover="wkOver(event,'${k}','today')" ondragleave="wkLeave()" ondrop="wkDrop(event,'${k}','today')">
        <div class="exp-hdr">
          <div>
            <div class="exp-title">${isCur?'<em>This week</em> · ':lbl?lbl+' · ':''}W${wkNum(d)}</div>
            <div class="exp-dates">${fmt(mon)} – ${fmt(sun)}</div>
          </div>
          <button class="exp-close" onclick="collapseWeek(event)">collapse</button>
        </div>
        <div class="k-grid">
          ${['today','doing','done'].map(sub=>`
            <div class="k-col ${sub==='today'?'ct':sub==='doing'?'cd':'cn'}"
              ondragover="wkOver(event,'${k}','${sub}')"
              ondragleave="wkLeave()"
              ondrop="wkDrop(event,'${k}','${sub}')">
              <div class="k-hd">${sub}</div>
              <div id="wkc-${k}-${sub}">
                ${(wdata.kanban[sub]||[]).map(it=>`
                  <div class="kcard" draggable="true"
                    onmousedown="startKDrag('${k}','${sub}','${it.id}','${it.title.replace(/'/g,"\\'")}')">
                    <span style="flex:1">${it.title}</span>
                    <button class="rm" onclick="rmWk('${k}','${sub}','${it.id}')">×</button>
                  </div>`).join('')}
              </div>
              <div class="dtgt" id="dt-${k}-${sub}">drop</div>
            </div>`).join('')}
        </div>
        <div class="exp-rh">
          <div class="rh-title-row">Rhythm this week</div>
          <div class="rh-rows">
            ${(S.rhythm_config||[]).map(rc=>{
              const val=wdata.rhythm?.[rc.id]||0;
              const tw=rc.target_weekly||0;
              const pct=tw>0?Math.min(100,Math.round(val/tw*100)):0;
              const hit=tw>0&&val>=tw;
              return `<div class="rh-row">
                <div class="rh-icon">${rc.icon}</div>
                <div class="rh-lbl">${rc.title}</div>
                <div class="rh-tgt">${tw>0?rc.target_weekly+' '+rc.unit:rc.target_monthly+'/mo'}</div>
                <div class="rh-ctr">
                  <button class="cb" onclick="adjRh('${k}','${rc.id}',-1)">−</button>
                  <div class="cv">${val}</div>
                  <button class="cb" onclick="adjRh('${k}','${rc.id}',1)">+</button>
                </div>
                ${tw>0?`<div class="rh-bar"><div class="rh-fill${hit?' hit':''}" style="width:${pct}%"></div></div>`:''}
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;

    strip.appendChild(col);
  }
  applyCal();
}

function ensureWeek(k){
  if(!S.weeks[k]) S.weeks[k]={kanban:{today:[],doing:[],done:[]},rhythm:emptyRhythm()};
  if(!S.weeks[k].rhythm) S.weeks[k].rhythm=emptyRhythm();
  if(!S.weeks[k].kanban) S.weeks[k].kanban={today:[],doing:[],done:[]};
}

function applyCal(){
  const strip=document.getElementById('calStrip');
  const wrap=document.getElementById('calWrap');
  const cols=[...strip.querySelectorAll('.wk')];
  if(!cols.length) return;

  const wrapW=wrap.getBoundingClientRect().width||800;
  const gap=8;
  const expandedCol=cols.find(c=>c.classList.contains('expanded'));

  if(expandedCol){
    // expanded col gets 60%, rest share remaining
    const expW=wrapW*0.6;
    const restW=(wrapW-expW-gap*(cols.length-1))/(cols.length-1);
    cols.forEach(c=>{
      c.style.flexBasis=c.classList.contains('expanded')?`${expW}px`:`${Math.max(80,restW)}px`;
    });
    // scroll so expanded is in view — find its index
    const idx=cols.indexOf(expandedCol);
    // centre of current week = BACK_RANGE + calOffset
    const leftIdx=idx-1<0?0:idx-1;
    const colW=Math.max(80,restW);
    const offset=leftIdx*(colW+gap);
    strip.style.transform=`translateX(-${offset}px)`;
  } else {
    // all collapsed — show 5 at a time, centre on current+offset
    const colW=(wrapW-gap*4)/5;
    cols.forEach(c=>c.style.flexBasis=`${Math.max(70,colW)}px`);
    const curIdx=BACK_RANGE; // index of current week in cols array
    const centreIdx=curIdx+calOffset;
    const leftIdx=Math.max(0,centreIdx-2);
    const offset=leftIdx*(Math.max(70,colW)+gap);
    strip.style.transform=`translateX(-${offset}px)`;
  }
}

function expandWeek(k){
  expandedWk=k;
  renderCal();
}
function collapseWeek(e){
  e.stopPropagation();
  expandedWk=null;
  renderCal();
}
function nav(n){
  calOffset=Math.max(-BACK_RANGE+2,Math.min(FWD_RANGE-2,calOffset+n));
  applyCal();
}
function goNow(){ calOffset=0; expandedWk=CURRENT_WK; renderCal(); }

// ── DRAG ─────────────────────────────────────────────────────
function startKDrag(wk,sub,id,title){
  dragItem={id,title};
  dragSrc=`week:${wk}:${sub}`;
}
function poolOver(e){ e.preventDefault(); e.currentTarget.style.outline='1px solid var(--b2)'; }
function poolLeave(e){ e.currentTarget.style.outline=''; }
function poolDrop(e,pool){
  e.preventDefault(); e.currentTarget.style.outline='';
  if(!dragItem) return;
  removeDragSrc();
  if(!S[pool]) S[pool]=[];
  S[pool].push(dragItem);
  dragItem=null; dragSrc=null;
  renderBacklog(); renderActions(); renderCal(); renderStatus(); renderCoS();
}
function wkOver(e,wk,sub){ e.preventDefault(); document.getElementById(`dt-${wk}-${sub}`)?.classList.add('over'); }
function wkLeave(){ document.querySelectorAll('.dtgt').forEach(z=>z.classList.remove('over')); }
function wkDrop(e,wk,sub){
  e.preventDefault();
  document.querySelectorAll('.dtgt').forEach(z=>z.classList.remove('over'));
  if(!dragItem) return;
  removeDragSrc();
  ensureWeek(wk);
  if(!S.weeks[wk].kanban[sub]) S.weeks[wk].kanban[sub]=[];
  S.weeks[wk].kanban[sub].push(dragItem);
  dragItem=null; dragSrc=null;
  renderBacklog(); renderActions(); renderCal(); renderStatus(); renderCoS();
}
function removeDragSrc(){
  if(!dragSrc) return;
  if(dragSrc==='backlog') S.backlog=S.backlog.filter(i=>i.id!==dragItem.id);
  else if(dragSrc==='actions') S.actions=S.actions.filter(i=>i.id!==dragItem.id);
  else if(dragSrc.startsWith('week:')){
    const [,wk,sub]=dragSrc.split(':');
    if(S.weeks[wk]?.kanban?.[sub]) S.weeks[wk].kanban[sub]=S.weeks[wk].kanban[sub].filter(i=>i.id!==dragItem.id);
  }
}
function removeFrom(pool,id){
  S[pool]=S[pool].filter(i=>i.id!==id);
  if(pool==='backlog') renderBacklog(); else renderActions();
  renderStatus(); renderCoS();
}
function rmWk(wk,sub,id){
  if(S.weeks[wk]?.kanban?.[sub]) S.weeks[wk].kanban[sub]=S.weeks[wk].kanban[sub].filter(i=>i.id!==id);
  renderCal();
}

// ── RHYTHM ───────────────────────────────────────────────────
function adjRh(wk,rid,delta){
  ensureWeek(wk);
  const cur=S.weeks[wk].rhythm[rid]||0;
  S.weeks[wk].rhythm[rid]=Math.max(0,cur+delta);
  renderCal(); renderMonthly(); renderStatus(); renderCoS();
}

// ── ADD CARDS ─────────────────────────────────────────────────
function addCard(pool){
  const inp=document.getElementById(pool==='backlog'?'blIn':'actIn');
  const t=inp.value.trim(); if(!t) return;
  const item={id:(pool==='backlog'?'bl':'ac')+'-'+Date.now(),title:t,added:NOW.toISOString().split('T')[0],age_weeks:0};
  S[pool].push(item); inp.value='';
  if(pool==='backlog') renderBacklog(); else renderActions();
  renderStatus(); renderCoS();
}

// ── CoS ──────────────────────────────────────────────────────
function askCoS(){
  const p=encodeURIComponent('Act as my Chief of Staff. Read my BaaS Operations board (Brain Area proj_Rv3aAAu49zkuEmkOhAlhLQ, document doc_wHbr7d396DWCz-pECowXWQ) and give me a full operational briefing: backlog vs actions health, what is planned this week, rhythm tracking vs targets for the last 4 weeks, and your single top priority recommendation right now.');
  window.open(`https://claude.ai/new?q=${p}`,'_blank');
}

// ── SAVE ─────────────────────────────────────────────────────
async function save(){
  const btn=document.getElementById('saveBtn'),st=document.getElementById('saveSt');
  btn.disabled=true; st.className='savest saving'; st.textContent='Saving to Brain...';
  S.last_updated=NOW.toISOString().split('T')[0];
  const content=`# Board State — Live\n# The BaaS Company | Leoni Janssen\n# Last updated: ${S.last_updated}\n# Schema version: 3.0\n# Rhythm is stored per-week inside each week object.\n\n\`\`\`json\n${JSON.stringify(S,null,2)}\n\`\`\``;
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:400,
        system:'You are a Brain document update agent. Use the Brain MCP update_document tool to update the specified document with the exact text content provided. Reply with just "SAVED".',
        messages:[{role:'user',content:`Update document ${DOC_ID} in project ${PROJECT_ID} using session ${SESSION_ID} with this exact content:\n\n${content}`}],
        mcp_servers:MCP})});
    st.className='savest saved';
    st.textContent=`Saved · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){st.className='savest err';st.textContent='Save failed';}
  btn.disabled=false;
}

window.addEventListener('resize',()=>{ if(S) applyCal(); });
load();
</script>
